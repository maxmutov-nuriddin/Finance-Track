<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Internet Required</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", Tahoma, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #0e5c49, #1b7d64);
        color: #f4fffa;
      }
      main {
        max-width: 420px;
        margin: 24px;
        padding: 28px 24px;
        border-radius: 18px;
        background: rgba(0, 0, 0, 0.18);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.35rem;
      }
      p {
        margin: 0;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Internet connection is required</h1>
      <p>This app is online-first. Reconnect to continue using live LMS data.</p>
    </main>
  </body>
</html>
